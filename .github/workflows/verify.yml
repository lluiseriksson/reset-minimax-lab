name: Finite entropy-game replay
on:
  push:
    paths:
      - 'finite_game50.py'
      - 'finite_game50-initial.py'
      - 'finite-game-results50.json'
      - 'finite-game-results50-initial.json'
      - 'manifest.json'
      - 'requirements.txt'
      - 'verify.py'
  pull_request:
    paths:
      - 'finite_game50.py'
      - 'finite_game50-initial.py'
      - 'finite-game-results50.json'
      - 'finite-game-results50-initial.json'
      - 'manifest.json'
      - 'requirements.txt'
      - 'verify.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-game:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-${{ matrix.os }}
          path: runs/verification.json
