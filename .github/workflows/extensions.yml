name: Spectral and Holevo finite diagnostics
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  extensions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-extensions.txt
      - run: python verify_extensions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extensions-${{ matrix.os }}
          path: runs/
