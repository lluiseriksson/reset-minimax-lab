name: Exact finite entropy certificate
on:
  push:
    paths:
      - 'certificates/finite_entropy/**'
      - '.github/workflows/exact-certificate.yml'
  pull_request:
    paths:
      - 'certificates/finite_entropy/**'
      - '.github/workflows/exact-certificate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-certificate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s certificates/finite_entropy -p 'test_*.py' -v
